<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guías Rítmicas del Coro</title>
<style>
/* Layout: barra superior fija + vista activa (biblioteca | editor a dos columnas | lector | setlists).
   La hoja de música siempre es papel blanco; la interfaz sigue el tema del visor. */
:root {
  --ink: #18223a;
  --paper: #ffffff;
  --bg: #eef0f4;
  --panel: #ffffff;
  --line: #d5d9e2;
  --muted: #5b6478;
  --accent: #7a1f3d;
  --accent-ink: #ffffff;
  --accent-soft: #f4e6eb;
  --warn: #8a5a00;
  --warn-bg: #fff5dc;
  --ok: #1f6b45;
  --font-display: 'GRTxtJ', 'Comic Sans MS', cursive;
  --font-body: 'GRTxtC', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e6e9f2; --bg: #141821; --panel: #1d2230; --line: #2f3647; --muted: #9aa3b8;
    --accent: #e28aa6; --accent-ink: #1a0b11; --accent-soft: #3a2230; --warn: #f2c66b; --warn-bg: #3a2f17; --ok: #7fd1a4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e6e9f2; --bg: #141821; --panel: #1d2230; --line: #2f3647; --muted: #9aa3b8;
  --accent: #e28aa6; --accent-ink: #1a0b11; --accent-soft: #3a2230; --warn: #f2c66b; --warn-bg: #3a2f17; --ok: #7fd1a4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-weight: 500; font-size: 16px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-size: 24px; letter-spacing: .5px; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--font-body); font-size: 13px; color: var(--muted); letter-spacing: 0; }
.tabs { display: flex; gap: 4px; }
.tabs a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--bg); font-weight: 700; }
.prefs { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg-label { font-size: 13px; color: var(--muted); margin-right: 6px; }

main { padding: 20px; max-width: 1500px; margin: 0 auto; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; border-radius: 7px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: #b3261e; }
.btn.small { padding: 4px 10px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1, h2 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; }
h2 { font-size: 18px; }
.muted { color: var(--muted); }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); margin-bottom: 16px; font-size: 15px; }

/* Biblioteca */
.lib-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
.lib-head input { flex: 1 1 220px; max-width: 360px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.song { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.song .t { font-family: var(--font-display); font-size: 21px; line-height: 1.15; }
.song .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.key { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.song .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 32px; text-align: center; display: grid; gap: 10px; justify-items: center; }

/* Editor */
.editor { display: grid; grid-template-columns: minmax(340px, 470px) 1fr; gap: 20px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.fields label { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
.fields label.wide { grid-column: 1 / -1; }
.fields input, .fields select { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-size: 15px; }
.tools { display: flex; flex-wrap: wrap; gap: 5px; }
.tools button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 5px; align-items: baseline; }
.tools button code { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 700; }
.tools button:hover { border-color: var(--accent); }
#cuerpo { width: 100%; min-height: 300px; resize: vertical; font-family: var(--mono); font-size: 14px; line-height: 1.7; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); tab-size: 2; }
.status { font-size: 13px; color: var(--muted); }
.status.ok { color: var(--ok); }
.warns { display: grid; gap: 4px; font-size: 14px; }
.warns div { background: var(--warn-bg); color: var(--warn); padding: 4px 9px; border-radius: 6px; }
details.help summary { cursor: pointer; font-weight: 700; }
.help table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.help td { border-top: 1px solid var(--line); padding: 5px 4px; vertical-align: top; }
.help td:first-child { font-family: var(--mono); color: var(--accent); font-weight: 700; white-space: nowrap; font-size: 13px; }

/* Hoja */
.sheet-wrap { display: grid; gap: 18px; justify-items: center; }
.sheet { width: 100%; max-width: 860px; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 22px rgba(20,30,60,.10); border-radius: 3px; line-height: 0; }
.sheet svg { width: 100%; height: auto; display: block; }
.sheet .mhit { fill: transparent; cursor: pointer; }
.sheet .mhit:hover { fill: rgba(122,31,61,.06); }
.sheet .mhit.on { fill: rgba(122,31,61,.11); }
.preview-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.reader-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }

/* Corte (constructor de ritmo) */
.rb { border: 1px solid var(--accent); border-radius: 9px; padding: 12px; display: grid; gap: 10px; background: var(--accent-soft); }
.rb-grid { display: grid; gap: 4px; }
.rb-cell { display: grid; gap: 3px; justify-items: center; }
.rb-cell button { width: 100%; min-width: 34px; height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; font-size: 18px; font-weight: 700; }
.rb-cell button[data-s="x"] { background: var(--ink); color: var(--panel); }
.rb-cell button[data-s="o"] { background: var(--muted); color: var(--panel); }
.rb-cell button[data-s="-"] { background: var(--panel); color: var(--ink); }
.rb-cell span { font-size: 12px; color: var(--muted); }
.rb input { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); width: 100%; }
.rb .legend { font-size: 13px; color: var(--muted); }

/* Setlists */
.sets { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 20px; align-items: start; }
.setlist-list { display: grid; gap: 8px; }
.setlist-list button { text-align: left; border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; border-radius: 8px; cursor: pointer; display: grid; }
.setlist-list button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.setlist-list small { color: var(--muted); }
.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: n; }
.order li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.order li::before { counter-increment: n; content: counter(n); font-family: var(--font-display); font-size: 20px; color: var(--accent); text-align: center; }
.order .t { font-weight: 700; }
.panel input[type="text"], .panel input[type="date"], .panel select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 8px; z-index: 50; max-width: calc(100% - 32px); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 980px) {
  .editor, .sets { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  main { padding: 14px 12px; }
  .top { padding: 8px 12px; }
  .prefs { margin-left: 0; }
  .fields { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Guías Rítmicas <small>del coro</small></div>
  <nav class="tabs" aria-label="Secciones">
    <a href="#biblioteca" id="tab-lib">Biblioteca</a>
    <a href="#setlists" id="tab-sets">Setlists</a>
  </nav>
  <div class="prefs">
    <div><span class="seg-label">Cifrado</span><span class="seg" role="group" aria-label="Cifrado">
      <button type="button" id="cif-am" data-cif="am">C D E</button><button type="button" id="cif-lat" data-cif="lat">Do Re Mi</button></span></div>
    <div><span class="seg-label">Letra</span><span class="seg" role="group" aria-label="Estilo de letra">
      <button type="button" id="est-J" data-est="J">Manuscrita</button><button type="button" id="est-C" data-est="C">Limpia</button></span></div>
  </div>
</header>
<main id="app"><p class="muted">Cargando…</p></main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>/*FONTS*/</script>
<script>/*MOTOR*/</script>
<script>
(() => {
  // ================= Estado =================
  const $ = (s, r = document) => r.querySelector(s);
  const app = $("#app");
  const LS = {
    get(k, d) { try { const v = localStorage.getItem("gr:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("gr:" + k, JSON.stringify(v)); } catch {} },
  };
  const state = {
    songs: {}, setlists: {}, loaded: false, slow: false,
    canEdit: false, db: null, downloads: null, local: false,
    prefs: { cif: LS.get("cif", "am"), est: LS.get("est", "J") },
    view: "lib", id: null, filter: "", activeSet: null, draft: null, saveTimer: null, saveState: "",
  };
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function toast(msg, ms = 3200) {
    const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), ms);
  }

  // ================= Datos =================
  const local = {
    load() { state.songs = LS.get("songs", {}); state.setlists = LS.get("setlists", {}); },
    save() { LS.set("songs", state.songs); LS.set("setlists", state.setlists); },
  };
  async function putSong(id, data) {
    state.songs[id] = data;
    if (state.db) await state.db.doc("songs/" + id).set(data);
    else local.save();
  }
  async function delSong(id) {
    delete state.songs[id];
    if (state.db) await state.db.doc("songs/" + id).delete(); else local.save();
  }
  async function putSet(id, data) {
    state.setlists[id] = data;
    if (state.db) await state.db.doc("setlists/" + id).set(data); else local.save();
  }
  async function delSet(id) {
    delete state.setlists[id];
    if (state.db) await state.db.doc("setlists/" + id).delete(); else local.save();
  }

  async function init() {
    await document.fonts.ready;
    try { await Promise.all(["GRTxtJ", "GRTxtC", "GRMusJ", "GRMusC"].map((f) => document.fonts.load(`16px '${f}'`, "A"))); await document.fonts.load(`700 16px 'GRTxtC'`); } catch {}
    paintPrefs();
    window.addEventListener("hashchange", route);
    route();
    const hasClaude = !!(window.claude && window.claude.use);
    if (!hasClaude) { startLocal(); return; }
    const [db, user, dl] = await Promise.all([
      window.claude.use("db").catch(() => null),
      window.claude.use("user").catch(() => null),
      window.claude.use("downloads").catch(() => null),
    ]);
    state.downloads = dl;
    if (!db) { startLocal(); return; }
    state.db = db;
    state.canEdit = user ? !!(await user.isOwner()) : false;
    let got = { songs: false, sets: false };
    const timer = setTimeout(() => { if (!state.loaded) { state.slow = true; render(); } }, 10000);
    const done = () => { if (got.songs && got.sets) { state.loaded = true; state.slow = false; clearTimeout(timer); } };
    db.collection("songs").onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach((d) => (next[d.id] = d.data()));
      // conservar el borrador local si se está editando
      if (state.view === "edit" && state.draft && next[state.id] && state.saveState === "pending") next[state.id] = state.songs[state.id];
      state.songs = next;
      if (!snap.metadata.fromCache) got.songs = true;
      done();
      if (state.view !== "edit") render();
    }, () => { got.songs = true; done(); render(); });
    db.collection("setlists").onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach((d) => (next[d.id] = d.data()));
      state.setlists = next;
      if (!snap.metadata.fromCache) got.sets = true;
      done();
      if (state.view !== "edit") render();
    }, () => { got.sets = true; done(); render(); });
  }
  function startLocal() {
    state.local = true; state.canEdit = true; state.loaded = true;
    local.load(); render();
  }

  // ================= Preferencias =================
  function paintPrefs() {
    document.querySelectorAll("[data-cif]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cif === state.prefs.cif)));
    document.querySelectorAll("[data-est]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.est === state.prefs.est)));
  }
  document.addEventListener("click", (e) => {
    const c = e.target.closest("[data-cif]"), s = e.target.closest("[data-est]");
    if (c) { state.prefs.cif = c.dataset.cif; LS.set("cif", state.prefs.cif); paintPrefs(); rerenderSheets(); }
    if (s) { state.prefs.est = s.dataset.est; LS.set("est", state.prefs.est); paintPrefs(); rerenderSheets(); }
  });
  function rerenderSheets() { if (state.view === "edit") updatePreview(); else render(); }

  // ================= Rutas =================
  function route() {
    const h = location.hash.replace(/^#/, "");
    let m;
    if ((m = h.match(/^cancion-([a-z0-9]+)$/))) { state.view = "song"; state.id = m[1]; }
    else if ((m = h.match(/^editar-([a-z0-9]+)$/))) { state.view = "edit"; state.id = m[1]; state.draft = null; }
    else if ((m = h.match(/^setlist-([a-z0-9]+)$/))) { state.view = "setview"; state.id = m[1]; }
    else if (h === "setlists") { state.view = "sets"; }
    else { state.view = "lib"; }
    $("#tab-lib").setAttribute("aria-current", ["lib", "song", "edit"].includes(state.view) ? "page" : "false");
    $("#tab-sets").setAttribute("aria-current", ["sets", "setview"].includes(state.view) ? "page" : "false");
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    if (state.view === "edit") return renderEditor();
    if (state.view === "song") return renderSong();
    if (state.view === "sets") return renderSets();
    if (state.view === "setview") return renderSetView();
    return renderLib();
  }

  function banners() {
    let s = "";
    if (state.local) s += `<div class="banner">Modo local: las guías se guardan solo en este navegador. Abre la app en claude.ai para guardarlas en la nube y compartirlas con el equipo.</div>`;
    if (state.slow && !state.loaded) s += `<div class="banner">No se pudo cargar la biblioteca todavía. Revisa tu conexión; la página seguirá intentando.</div>`;
    return s;
  }
  const sortedSongs = () => Object.entries(state.songs).sort((a, b) => (a[1].titulo || "").localeCompare(b[1].titulo || "", "es"));
  const fmtTono = (t) => {
    if (!t) return "";
    const c = GR.parseChord(String(t).trim().split(/\s+/)[0]);
    return c ? GR.chordText(c, state.prefs.cif) : t;
  };

  // ================= Biblioteca =================
  function renderLib() {
    const q = state.filter.toLowerCase();
    const list = sortedSongs().filter(([, s]) => !q || (s.titulo + " " + (s.subtitulo || "")).toLowerCase().includes(q));
    let h = banners();
    h += `<div class="lib-head"><h1>Biblioteca</h1>
      <label class="sr" for="buscar">Buscar alabanza</label>
      <input id="buscar" type="search" placeholder="Buscar alabanza…" value="${esc(state.filter)}">
      ${state.canEdit ? `<button class="btn primary" id="nueva" type="button">+ Nueva guía</button>` : ""}</div>`;
    if (!state.loaded) h += `<p class="muted">Cargando biblioteca…</p>`;
    else if (!Object.keys(state.songs).length) {
      h += `<div class="empty"><h2>Aún no hay guías</h2><p class="muted">${state.canEdit ? "Crea la primera alabanza. La guía se arma escribiendo compases y se ve al instante como partitura." : "Cuando el líder publique guías aparecerán aquí."}</p>
      ${state.canEdit ? `<button class="btn primary" type="button" data-act="nueva">+ Crear primera guía</button>` : ""}</div>`;
    } else if (!list.length) h += `<p class="muted">Ninguna alabanza coincide con «${esc(state.filter)}».</p>`;
    else {
      h += `<div class="songs">` + list.map(([id, s]) => `
        <article class="song">
          <div class="t">${esc(s.titulo || "Sin título")}</div>
          ${s.subtitulo ? `<div class="muted">${esc(s.subtitulo)}</div>` : ""}
          <div class="meta">${s.tono ? `<span class="chip key">${esc(fmtTono(s.tono))}</span>` : ""}${s.bpm ? `<span class="chip">♩ ${esc(s.bpm)}</span>` : ""}<span class="chip">${esc(s.compas || "4/4")}</span>${s.estilo ? `<span class="chip">${esc(s.estilo)}</span>` : ""}</div>
          <div class="acts">
            <a class="btn small" href="#cancion-${id}">Ver guía</a>
            <button class="btn small" type="button" data-pdf="${id}">PDF</button>
            ${state.canEdit ? `<a class="btn small" href="#editar-${id}">Editar</a><button class="btn small" type="button" data-dup="${id}">Duplicar</button><button class="btn small danger" type="button" data-del="${id}">Eliminar</button>` : ""}
          </div>
          <div class="confirm hidden row" data-confirm="${id}"><span>¿Eliminar «${esc(s.titulo || "Sin título")}»?</span><button class="btn small danger" type="button" data-delok="${id}">Sí, eliminar</button><button class="btn small" type="button" data-delno="${id}">Cancelar</button></div>
        </article>`).join("") + `</div>`;
    }
    app.innerHTML = h;
    const b = $("#buscar");
    if (b) b.addEventListener("input", () => { state.filter = b.value; const pos = b.selectionStart; renderLib(); const nb = $("#buscar"); nb.focus(); nb.setSelectionRange(pos, pos); });
  }

  const NEW_SONG = () => ({
    titulo: "Nueva alabanza", subtitulo: "", instrumento: "Guitarra-Piano", autor: "", tono: "C", compas: "4/4", bpm: "72", estilo: "", mapa: "", porLinea: 4,
    cuerpo: `- || C | G |\n[A] "Primera frase…" C | G/B | Am | F |\nC | G | F G {o--o----} | C* :|\n`,
  });

  app.addEventListener("click", async (e) => {
    const t = e.target.closest("button, a"); if (!t) return;
    const d = t.dataset;
    if (t.id === "nueva" || d.act === "nueva") {
      const id = uid(); const s = { ...NEW_SONG(), actualizado: Date.now() };
      try { await putSong(id, s); location.hash = "editar-" + id; } catch (err) { toast("No se pudo crear la guía: " + (err.message || err.code)); }
    }
    if (d.dup) {
      const id = uid(); const s = { ...state.songs[d.dup], titulo: (state.songs[d.dup].titulo || "") + " (copia)", actualizado: Date.now() };
      try { await putSong(id, s); toast("Guía duplicada."); render(); } catch (err) { toast("No se pudo duplicar: " + (err.message || err.code)); }
    }
    if (d.del) $(`[data-confirm="${d.del}"]`).classList.remove("hidden");
    if (d.delno) $(`[data-confirm="${d.delno}"]`).classList.add("hidden");
    if (d.delok) { try { await delSong(d.delok); toast("Guía eliminada."); render(); } catch (err) { toast("No se pudo eliminar: " + (err.message || err.code)); } }
    if (d.pdf) exportPDF([d.pdf], (state.songs[d.pdf].titulo || "Guía") + " - Guía.pdf");

  // ================= Lector =================
  function sheetsHTML(song, { hits = false } = {}) {
    const r = GR.render(song, { estilo: state.prefs.est, cifrado: state.prefs.cif });
    return { r, html: r.pages.map((p, i) => {
      const extra = hits ? r.hits[i].map((h) => `<rect class="mhit" data-s="${h.start}" data-e="${h.end}" data-n="${h.num}" x="${h.x.toFixed(1)}" y="${h.y.toFixed(1)}" width="${h.w.toFixed(1)}" height="${h.h.toFixed(1)}"><title>Compás ${h.num}</title></rect>`).join("") : "";
      return `<div class="sheet" role="img" aria-label="${esc(song.titulo || "Guía")} página ${i + 1}">${GR.pageSVG(p, { extra })}</div>`;
    }).join("") };
  }

  function insertAt(ta, text, backFromEnd = 0) {
    const a = ta.selectionStart, b = ta.selectionEnd;
    ta.setRangeText(text, a, b, "end");
    if (backFromEnd) { const p = a + text.length - backFromEnd - (text.endsWith(" ") ? 1 : 0); ta.setSelectionRange(p, p); }
    ta.focus();
    ta.dispatchEvent(new Event("input"));
  }

  let prevTimer;
  function changed() {
    state.saveState = "pending";
    const st = $("#status"); if (st) { st.textContent = "Cambios sin guardar…"; st.className = "status"; }

    clearTimeout(state.saveTimer); state.saveTimer = setTimeout(flushSave, 1500);
  }
  async function flushSave() {
    clearTimeout(state.saveTimer);
    if (state.saveState !== "pending" || !state.draft) return;
    const id = state.id, data = { ...state.draft, actualizado: Date.now() };
    state.saveState = "saving";
    try {
      await putSong(id, data);
      if (state.saveState === "saving") state.saveState = "saved";
      const st = $("#status"); if (st && state.saveState === "saved") { st.textContent = "Guardado"; st.className = "status ok"; }
    } catch (err) {
      state.saveState = "pending";
      const st = $("#status"); if (st) { st.textContent = "No se pudo guardar. " + (err.code === "quota_exceeded" ? "La biblioteca está llena." : "Reintentando…"); }
      state.saveTimer = setTimeout(flushSave, 4000);
    }
  }

    const pv = $("#preview"); if (!pv || !state.draft) return;

  function highlightCaret() {
    const ta = $("#cuerpo"); if (!ta) return;

    let best = null;
    app.querySelectorAll(".mhit").forEach((r) => {
      r.classList.remove("on");
      const s = +r.dataset.s, e = +r.dataset.e;
      if (p >= s && p <= e + 1) best = r;
    });

  }

  // ---------- Constructor de cortes ----------
  function openRhythm() {
    const box = $("#rb");
    const t = GR.parseTime(state.draft.compas);
    const E = t.eighths;
    const labels = [];
    for (let i = 0; i < E; i++) labels.push(t.compound ? (i % 3 === 0 ? String(i / 3 + 1) : "·") : (i % 2 === 0 ? String(i / 2 + 1) : "y"));
    const cells = Array(E).fill(".");
    cells[0] = "x";
    const SYM = { x: "›", o: "●", "-": "—", ".": "" };
    const draw = () => {
      box.innerHTML = `<div class="row" style="justify-content:space-between"><strong>Corte en corcheas (${t.label})</strong><button class="btn small" type="button" id="rb-close">Cerrar</button></div>
        <div class="legend">Toca cada casilla para cambiar: <b>›</b> golpe acentuado · <b>●</b> golpe · <b>—</b> sostener · vacío = silencio.</div>
        <div class="rb-grid" style="grid-template-columns:repeat(${E},1fr)">${cells.map((c, i) => `<div class="rb-cell"><button type="button" data-cell="${i}" data-s="${c}" aria-label="Corchea ${i + 1}: ${c === "x" ? "golpe acentuado" : c === "o" ? "golpe" : c === "-" ? "sostener" : "silencio"}">${SYM[c]}</button><span>${labels[i]}</span></div>`).join("")}</div>
        <label for="rb-ch">Acordes de los golpes, en orden</label><input id="rb-ch" type="text" placeholder="Em F#m G A" value="${esc(box.dataset.ch || "")}">
        <div class="row"><code id="rb-out" style="font-family:var(--mono)"></code><button class="btn small primary" type="button" id="rb-ins">Insertar compás</button></div>`;
      const out = () => { const ch = $("#rb-ch").value.trim(); return `${ch ? ch + " " : ""}{${cells.join("")}} | `; };
      $("#rb-out").textContent = out();
      $("#rb-ch").addEventListener("input", (e) => { box.dataset.ch = e.target.value; $("#rb-out").textContent = out(); });
      box.querySelectorAll("[data-cell]").forEach((b) => b.addEventListener("click", () => {
        const i = +b.dataset.cell; const order = ["x", "o", "-", "."];
        let n = order[(order.indexOf(cells[i]) + 1) % 4];
        if (n === "-" && i === 0) n = "-"; // permitido: liga con el compás anterior
        cells[i] = n; draw(); box.querySelector(`[data-cell="${i}"]`).focus();
      }));
      $("#rb-close").addEventListener("click", () => box.classList.add("hidden"));
      $("#rb-ins").addEventListener("click", () => { insertAt($("#cuerpo"), out()); box.classList.add("hidden"); });
    };
    box.classList.remove("hidden");
    draw();
  }

  function fmtFecha(f) {
    if (!f) return "Sin fecha";

    const id = state.activeSet, cur = id && state.setlists[id];

      await putSet(nid, { nombre: "Culto del domingo", fecha: sunday.toISOString().slice(0, 10), canciones: [] }).catch((err) => toast("No se pudo crear: " + (err.message || err.code)));
      state.activeSet = nid; renderSets();
    });
    app.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => { state.activeSet = b.dataset.set; renderSets(); }));

    $("#s-add")?.addEventListener("change", async (e) => { if (!e.target.value) return; await save({ canciones: [...list, e.target.value] }); renderSets(); });

      const l = [...list];

      if (b.dataset.down) { const i = +b.dataset.down; [l[i + 1], l[i]] = [l[i], l[i + 1]]; }
      if (b.dataset.rm) l.splice(+b.dataset.rm, 1);
      await save({ canciones: l }); renderSets();
    }));
    $("#set-pdf")?.addEventListener("click", () => exportPDF(list, (cur.nombre || "Setlist") + " " + (cur.fecha || "") + ".pdf"));

  // ================= PDF =================
  let exporting = false;
  async function exportPDF(ids, filename) {
    if (exporting) return;
    if (!window.jspdf) { toast("No se pudo cargar el generador de PDF. Revisa tu conexión y recarga."); return; }
    exporting = true;
    toast("Preparando PDF…", 60000);
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "pt", format: "letter", compress: true });
      let first = true;
      for (const id of ids) {
        const song = state.view === "edit" && id === state.id && state.draft ? state.draft : state.songs[id];
        if (!song) continue;
        const r = GR.render(song, { estilo: state.prefs.est, cifrado: state.prefs.cif });
        for (const p of r.pages) {
          const png = await rasterize(GR.pageSVG(p, { embedFonts: true }), 3);
          if (!first) pdf.addPage("letter");
          pdf.addImage(png, "PNG", 0, 0, 612, 792, undefined, "FAST");
          first = false;
        }
      }
      const data = pdf.output("arraybuffer");
      if (!state.downloads) {
        if (state.local) {
          const url = URL.createObjectURL(new Blob([data], { type: "application/pdf" }));
          const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
          toast("PDF generado.");
        } else toast("La descarga no está disponible en esta vista. Abre la app en claude.ai para descargar el PDF.");
        return;
      }
      await state.downloads.save({ filename: filename.replace(/[\\/:*?"<>|]/g, "-"), data });
      toast("PDF listo para imprimir.");
    } catch (err) {
      const c = err && err.code;
      if (c === "declined") toast("Descarga cancelada.");
      else if (c === "rate_limited") toast("Ya hay una descarga esperando confirmación.");
      else toast("No se pudo generar el PDF" + (err && err.message ? ": " + err.message : "."));
    } finally { exporting = false; }
  }
  function rasterize(svg, scale) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
      const img = new Image();
      img.onload = async () => {
        try { if (img.decode) await img.decode(); } catch {}
        // pequeña espera para que las fuentes incrustadas terminen de cargar dentro de la imagen
        await new Promise((r) => setTimeout(r, 60));
        const c = document.createElement("canvas");
        c.width = GR.PW * scale; c.height = GR.PH * scale;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/png"));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("no se pudo dibujar la página")); };
      img.src = url;
    });
  }

  // fuentes de la app (mismas que la partitura)
  const st = document.createElement("style"); st.textContent = GR.fontFaceCSS(); document.head.appendChild(st);
  init();
})();
</script>
