<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guías Rítmicas del Coro</title>
<style>
/* Layout: barra superior fija + vista activa (biblioteca | editor a dos columnas | lector | setlists).
   La hoja de música siempre es papel blanco; la interfaz sigue el tema del visor. */
:root {
  --ink: #18223a;
  --paper: #ffffff;
  --bg: #eef0f4;
  --panel: #ffffff;
  --line: #d5d9e2;
  --muted: #5b6478;
  --accent: #7a1f3d;
  --accent-ink: #ffffff;
  --accent-soft: #f4e6eb;
  --warn: #8a5a00;
  --warn-bg: #fff5dc;
  --ok: #1f6b45;
  --font-display: 'GRTxtJ', 'Comic Sans MS', cursive;
  --font-body: 'GRTxtC', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e6e9f2; --bg: #141821; --panel: #1d2230; --line: #2f3647; --muted: #9aa3b8;
    --accent: #e28aa6; --accent-ink: #1a0b11; --accent-soft: #3a2230; --warn: #f2c66b; --warn-bg: #3a2f17; --ok: #7fd1a4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e6e9f2; --bg: #141821; --panel: #1d2230; --line: #2f3647; --muted: #9aa3b8;
  --accent: #e28aa6; --accent-ink: #1a0b11; --accent-soft: #3a2230; --warn: #f2c66b; --warn-bg: #3a2f17; --ok: #7fd1a4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-weight: 500; font-size: 16px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-size: 24px; letter-spacing: .5px; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--font-body); font-size: 13px; color: var(--muted); letter-spacing: 0; }
.tabs { display: flex; gap: 4px; }
.tabs a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--bg); font-weight: 700; }
.prefs { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg-label { font-size: 13px; color: var(--muted); margin-right: 6px; }

main { padding: 20px; max-width: 1500px; margin: 0 auto; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; border-radius: 7px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: #b3261e; }
.btn.small { padding: 4px 10px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1, h2 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; }
h2 { font-size: 18px; }
.muted { color: var(--muted); }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); margin-bottom: 16px; font-size: 15px; }

/* Biblioteca */
.lib-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
.lib-head input { flex: 1 1 220px; max-width: 360px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.song { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.song .t { font-family: var(--font-display); font-size: 21px; line-height: 1.15; }
.song .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.key { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.song .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 32px; text-align: center; display: grid; gap: 10px; justify-items: center; }

/* Editor */
.editor { display: grid; grid-template-columns: minmax(340px, 470px) 1fr; gap: 20px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.fields label { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
.fields label.wide { grid-column: 1 / -1; }
.fields input, .fields select { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-size: 15px; }
.tools { display: flex; flex-wrap: wrap; gap: 5px; }
.tools button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 5px; align-items: baseline; }
.tools button code { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 700; }
.tools button:hover { border-color: var(--accent); }
#cuerpo { width: 100%; min-height: 300px; resize: vertical; font-family: var(--mono); font-size: 14px; line-height: 1.7; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); tab-size: 2; }
.status { font-size: 13px; color: var(--muted); }
.status.ok { color: var(--ok); }
.warns { display: grid; gap: 4px; font-size: 14px; }
.warns div { background: var(--warn-bg); color: var(--warn); padding: 4px 9px; border-radius: 6px; }
details.help summary { cursor: pointer; font-weight: 700; }
.help table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.help td { border-top: 1px solid var(--line); padding: 5px 4px; vertical-align: top; }
.help td:first-child { font-family: var(--mono); color: var(--accent); font-weight: 700; white-space: nowrap; font-size: 13px; }

/* Hoja */
.sheet-wrap { display: grid; gap: 18px; justify-items: center; }
.sheet { width: 100%; max-width: 860px; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 22px rgba(20,30,60,.10); border-radius: 3px; line-height: 0; }
.sheet svg { width: 100%; height: auto; display: block; }
.sheet .mhit { fill: transparent; cursor: pointer; }
.sheet .mhit:hover { fill: rgba(122,31,61,.06); }
.sheet .mhit.on { fill: rgba(122,31,61,.11); }
.preview-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.reader-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }

/* Corte (constructor de ritmo) */
.rb { border: 1px solid var(--accent); border-radius: 9px; padding: 12px; display: grid; gap: 10px; background: var(--accent-soft); }
.rb-grid { display: grid; gap: 4px; }
.rb-cell { display: grid; gap: 3px; justify-items: center; }
.rb-cell button { width: 100%; min-width: 34px; height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; font-size: 18px; font-weight: 700; }
.rb-cell button[data-s="x"] { background: var(--ink); color: var(--panel); }
.rb-cell button[data-s="o"] { background: var(--muted); color: var(--panel); }
.rb-cell button[data-s="-"] { background: var(--panel); color: var(--ink); }
.rb-cell span { font-size: 12px; color: var(--muted); }
.rb input { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); width: 100%; }
.rb .legend { font-size: 13px; color: var(--muted); }

/* Setlists */
.sets { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 20px; align-items: start; }
.setlist-list { display: grid; gap: 8px; }
.setlist-list button { text-align: left; border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; border-radius: 8px; cursor: pointer; display: grid; }
.setlist-list button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.setlist-list small { color: var(--muted); }
.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: n; }
.order li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.order li::before { counter-increment: n; content: counter(n); font-family: var(--font-display); font-size: 20px; color: var(--accent); text-align: center; }
.order .t { font-weight: 700; }
.panel input[type="text"], .panel input[type="date"], .panel select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 8px; z-index: 50; max-width: calc(100% - 32px); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 980px) {
  .editor, .sets { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  main { padding: 14px 12px; }
  .top { padding: 8px 12px; }
  .prefs { margin-left: 0; }
  .fields { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Guías Rítmicas <small>del coro</small></div>
  <nav class="tabs" aria-label="Secciones">
    <a href="#biblioteca" id="tab-lib">Biblioteca</a>
    <a href="#setlists" id="tab-sets">Setlists</a>
  </nav>
  <div class="prefs">
    <div><span class="seg-label">Cifrado</span><span class="seg" role="group" aria-label="Cifrado">
      <button type="button" id="cif-am" data-cif="am">C D E</button><button type="button" id="cif-lat" data-cif="lat">Do Re Mi</button></span></div>
    <div><span class="seg-label">Letra</span><span class="seg" role="group" aria-label="Estilo de letra">
      <button type="button" id="est-J" data-est="J">Manuscrita</button><button type="button" id="est-C" data-est="C">Limpia</button></span></div>
  </div>
</header>
<main id="app"><p class="muted">Cargando…</p></main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

const GR = (() => {

  };
  const G = {

    slash: "\uE101", slashWhole: "\uE102", slashHalf: "\uE103", diamondWhole: "\uE0D8", diamondHalf: "\uE0D9",
    restWhole: "\uE4E3", restHalf: "\uE4E4", restQuarter: "\uE4E5", rest8: "\uE4E6",

  // ---------- Teoría: acordes y tonalidades ----------
  const LAT2AM = { Do: "C", Re: "D", Mi: "E", Fa: "F", Sol: "G", La: "A", Si: "B" };
  const AM2LAT = { C: "Do", D: "Re", E: "Mi", F: "Fa", G: "Sol", A: "La", B: "Si" };
  const ROOT_RE = /^(Do|Re|Mi|Fa|Sol|La|Si|[A-G])(#|b|♯|♭)?/;

  function readRoot(s) {
    // normaliza mayúscula inicial para cifrado latino ("sol" -> "Sol")
    const t = s.replace(/^(do|re|mi|fa|sol|la|si)/i, (m) => m[0].toUpperCase() + m.slice(1).toLowerCase());

    let t = tok;
    let hold = false, fermata = false;
    while (/[*^]$/.test(t)) {
      if (t.endsWith("*")) hold = true;
      if (t.endsWith("^")) fermata = true;
      t = t.slice(0, -1);

    const r = readRoot(t);
    if (!r) return null;
    let rest = t.slice(r.len);

    return { root: r.root, acc: r.acc, qual: rest, bass, hold, fermata, src: tok };

    if (b === "||:") return "|:";
    if (b === ":||") return ":|";
    return b;

    if (!a || a === "|") return b;
    if (b === "|") return a;
    if ((a === ":|" && b === "|:") || (a === "|:" && b === ":|")) return ":|:";

  }

  function parse(song) {
    const body = song.cuerpo || "";

    const warnings = [];
    const measures = [];
    let cur = null;
    let pendingLeft = null;
    let pendingBreak = false;
    let time = baseTime;

    const finish = (rightBar) => {
      if (!cur || cur.toks.length === 0) {

        return;
      }
      cur.rightBar = rightBar || "|";
      const m = interpret(cur, measures.length + 1, time, warnings);
      if (m.timeChange) time = m.time;
      m.time = time;
      if (pendingLeft && !m.leftBar) m.leftBar = pendingLeft;
      measures.push(m);
      pendingLeft = null;
      pendingBreak = false;
      cur = null;
    };

    let offset = 0;
    const lines = body.split("\n");
    for (const line of lines) {
      if (/^\s*#/.test(line)) { offset += line.length + 1; continue; }
      let any = false;
      TOKEN_RE.lastIndex = 0;
      let mm;
      while ((mm = TOKEN_RE.exec(line))) {
        const [full, bar, grp, word, other] = mm;
        const s = offset + mm.index, e = s + full.length;
        if (bar) {
          const b = normBar(bar);
          if (!cur || !cur.toks.length) {
            if (measures.length && !(cur && cur.breakBefore && !any)) {
              const prev = measures[measures.length - 1];
              if (any || !pendingBreak) prev.rightBar = mergeBars(prev.rightBar, b);
              else if (b === "|:" || b === ":|:") {
                if (b === ":|:") prev.rightBar = mergeBars(prev.rightBar, ":|");
                pendingLeft = "|:";
              } else prev.rightBar = mergeBars(prev.rightBar, b);
            } else if (b === "|:" || b === ":|:") pendingLeft = "|:";
            else if (measures.length) {
              measures[measures.length - 1].rightBar = mergeBars(measures[measures.length - 1].rightBar, b);
            }
          } else finish(b);
          continue;
        }
        if (!cur) cur = newMeasure();
        if (cur.start < 0) cur.start = s;
        cur.end = e;
        cur.toks.push({ v: full, grp: !!grp, other: !!other, s, e });
        any = true;
      }
      if (cur && cur.toks.length) finish("|");
      cur = null;
      if (any || measures.length) pendingBreak = true;
      offset += line.length + 1;
    }
    if (measures.length) {
      const last = measures[measures.length - 1];
      if (last.rightBar === "|" || !last.rightBar) last.rightBar = "|]";
    }
    // inicio de repetición
    for (let i = 0; i < measures.length; i++) {
      const m = measures[i];
      const prevBar = i > 0 ? measures[i - 1].rightBar : null;
      m.startRepeat = m.leftBar === "|:" || prevBar === "|:" || prevBar === ":|:";
    }
    // empates hacia el compás siguiente
    for (let i = 1; i < measures.length; i++) {
      if (measures[i].tieIn) {
        const p = measures[i - 1];
        if (p.events && p.events.length) {
          const last = [...p.events].reverse().find((e) => e.kind === "note");
          if (last) last.tieOut = true;
        } else if (p.slots) {
          p.tieOutSlot = true;
        }
      }
    }
    // secciones para el mapa
    const sections = measures.filter((m) => m.mark).map((m) => m.mark);
    return { measures, warnings, time: baseTime, sections };
  }

  function interpret(raw, num, time, warnings) {
    const m = {
      num, start: raw.start, end: raw.end, leftBar: raw.leftBar, rightBar: raw.rightBar,
      breakBefore: raw.breakBefore, mark: null, cue: null, dirs: [], volta: null,
      segno: false, coda: false, rest: false, repeat: false, slots: [], rhythm: null,
      stemmed: false, timeChange: false,
    };
    let t = time;
    // figuras con duración: C:2 (blanca), C:1 (redonda), C:4 (negra), C:8 (corchea), C:2. (con puntillo), s:2 (silencio)
    const figs = [];
    let hasDur = false;
    for (const tk of raw.toks) {
      let v = tk.v;
      let dur = null;
      const dm = !tk.grp && v.match(/^(.+):(1|2|4|8)(\.?)$/);
      if (dm) {
        v = dm[1];
        dur = { 1: 8, 2: 4, 4: 2, 8: 1 }[dm[2]] * (dm[3] ? 1.5 : 1);
        if (dur % 1) { warnings.push({ num, msg: `La corchea con puntillo (:8.) no está disponible; usa un corte {…}.` }); dur = 1; }
        hasDur = true;
      }
      if (/^[sS]$/.test(v) && dur) { figs.push({ rest: true, dur }); continue; }
      if (tk.other) { warnings.push({ num, msg: `No entendí el símbolo «${v}».` }); continue; }
      if (v[0] === "[") { m.mark = v.replace(/^\[|\]$/g, "").trim(); continue; }
      if (v[0] === '"' || v[0] === "“") { m.cue = v.replace(/^["“]|["”]$/g, "").trim(); continue; }
      if (v[0] === "(") { m.dirs.push(v.replace(/^\(|\)$/g, "").trim()); continue; }
      if (v[0] === "{") { m.rhythm = v.replace(/^\{|\}$/g, ""); continue; }
      if (/^\d+\.(\d+\.)*$/.test(v)) { m.volta = v; continue; }
      if (/^\d+\/\d+$/.test(v)) { t = parseTime(v); m.timeChange = true; m.time = t; continue; }
      if (/^segno$/i.test(v)) { m.segno = true; continue; }
      if (/^coda$/i.test(v)) { m.coda = true; continue; }
      if (v === "-") { m.rest = true; continue; }
      if (v === "%") { m.repeat = true; continue; }
      if (v === "/" || v === ".") { m.slots.push(null); figs.push({ chord: null, dur }); continue; }
      if (v === "^" ) { const l = m.slots[m.slots.length - 1]; if (l) l.fermata = true; else m.fermataBar = true; continue; }
      const c = parseChord(v);
      if (c) { m.slots.push(c); figs.push({ chord: c, dur }); continue; }
      warnings.push({ num, msg: `No reconozco «${v}» como acorde.` });
    }
    m.time = t;
    if (hasDur && m.rhythm == null) {
      // se convierte en un corte: cada figura sin número dura un tiempo
      const beat = t.compound ? 3 : t.den === 8 ? 1 : 2;
      m.rhythm = figs.map((g) => {
        const d = g.dur || beat;
        return g.rest ? ".".repeat(d) : "o" + "-".repeat(d - 1);
      }).join("");
      m.slots = figs.filter((g) => !g.rest).map((g) => g.chord || null);
      m.figPattern = true;
    }
    if (m.rhythm != null) {
      buildRhythm(m, t, warnings);
    } else if (!m.rest && !m.repeat) {
      const n = m.slots.length;
      const b = t.beats;
      if (n === 0) m.slots = Array(b).fill(null);
      else if (n > b) {
        warnings.push({ num, msg: `Tiene ${n} tiempos y el compás ${t.label} admite ${b}. Usa un corte {…} para figuras más rápidas.` });
        m.slots = m.slots.slice(0, b);
      } else if (n < b) {
        if (b % n === 0) {
          const step = b / n, arr = Array(b).fill(null);
          m.slots.forEach((c, i) => (arr[i * step] = c));
          m.slots = arr;
        } else m.slots = m.slots.concat(Array(b - n).fill(null));
      }
      m.stemmed = b >= 3 && m.slots.every((c) => c);
    }
    return m;
  }

  // ---------- Ritmo en corcheas ----------
  function validDur(start, d, t, rest) {
    const E = t.eighths;
    if (start + d > E) return false;
    if (t.compound) {
      if (d === E) return start === 0;
      if (d === 6) return start % 6 === 0;
      if (d === 3) return start % 3 === 0;
      if (d === 2) return !rest && start % 3 === 0;
      return d === 1;
    }
    if (d === 8) return start === 0 && E === 8;
    if (d === 6) return !rest && (start === 0 || (start === 2 && E === 8));
    if (d === 4) return E === 8 ? start % 4 === 0 : start % 2 === 0;
    if (d === 3) return !rest && start % 2 === 0;
    if (d === 2) return start % 2 === 0;
    return d === 1;
  }
  function splitDur(start, len, t, rest) {
    const out = [];
    const opts = [8, 6, 4, 3, 2, 1];
    while (len > 0) {
      let d = 1;
      for (const o of opts) if (o <= len && validDur(start, o, t, rest)) { d = o; break; }
      out.push({ start, dur: d });
      start += d; len -= d;
    }
    return out;
  }

  function buildRhythm(m, t, warnings) {
    let p = m.rhythm.replace(/\s|\|/g, "").replace(/X/g, "x").replace(/O/g, "o").replace(/_/g, "-").replace(/r/gi, ".");
    const bad = p.replace(/[xo.\-]/g, "");
    if (bad) warnings.push({ num: m.num, msg: `El corte solo usa x (golpe acentuado), o (golpe), - (sostener) y . (silencio).` });
    p = p.replace(/[^xo.\-]/g, "");
    const E = t.eighths;
    if (p.length !== E) {
      warnings.push({ num: m.num, msg: m.figPattern
        ? `Las figuras suman ${p.length / 2} tiempos y el compás ${t.label} lleva ${E / 2}.`
        : `El corte tiene ${p.length} corcheas y el compás ${t.label} lleva ${E}.` });
      p = (p + ".".repeat(E)).slice(0, E);
    }
    const chords = m.figPattern ? m.slots : m.slots.filter(Boolean);
    m.slots = null;
    const evs = [];
    let i = 0, ci = 0;
    if (p[0] === "-") {
      let k = 0; while (p[k] === "-") k++;
      evs.push({ kind: "note", start: 0, len: k, accent: false, chord: null, tieIn: true });
      m.tieIn = true; i = k;
    }
    while (i < E) {
      const ch = p[i];
      if (ch === "x" || ch === "o") {
        let k = i + 1; while (k < E && p[k] === "-") k++;
        evs.push({ kind: "note", start: i, len: k - i, accent: ch === "x", chord: chords[ci++] || null });
        i = k;
      } else if (ch === ".") {
        let k = i + 1; while (k < E && p[k] === ".") k++;
        evs.push({ kind: "rest", start: i, len: k - i });
        i = k;
      } else i++;
    }
    if (ci < chords.length) warnings.push({ num: m.num, msg: `Sobran acordes: hay ${chords.length} y el corte tiene ${ci} golpes.` });
    // dividir en figuras escribibles
    const pieces = [];
    for (const ev of evs) {
      if (ev.kind === "rest") {
        if (ev.len === E) { pieces.push({ kind: "rest", start: 0, dur: E, whole: true }); continue; }
        for (const s of splitDur(ev.start, ev.len, t, true)) pieces.push({ kind: "rest", ...s });
      } else {
        const parts = splitDur(ev.start, ev.len, t, false);
        parts.forEach((s, j) => pieces.push({
          kind: "note", ...s, accent: j === 0 && ev.accent, chord: j === 0 ? ev.chord : null,
          tieOut: j < parts.length - 1, tieIn: j === 0 && ev.tieIn,
        }));
      }
    }
    m.events = pieces;
    m.fermataOnLast = chords.some((c) => c && c.fermata);
  }

  // ---------- Cifrado en pantalla ----------
  function chordParts(c, cifrado) {
    const name = (r) => (cifrado === "lat" ? AM2LAT[r] : r);
    return { root: name(c.root), acc: c.acc, qual: c.qual, bass: c.bass ? { root: name(c.bass.root), acc: c.bass.acc } : null };
  }

  function chordSVG(c, x, y, st, cifrado, size) {
    const f = FAM[st];
    const p = chordParts(c, cifrado);
    const F = size;
    const accT = (a, base) => {
      if (!a) return "";
      const up = a === "#" ? 0.5 : 0.28;
      const fs = (a === "#" ? 0.95 : 1.12) * F * (st === "J" ? 0.85 : 1);
      return `<tspan font-family="${f.mus}" font-size="${fs.toFixed(1)}" dy="${(-up * F).toFixed(1)}" dx="${(0.05 * F).toFixed(1)}">${a === "#" ? G.sharp : G.flat}</tspan><tspan font-size="${base.toFixed(1)}" dy="${(up * F).toFixed(1)}" dx="${(0.04 * F).toFixed(1)}">\u200B</tspan>`;
    };
    let s = `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${f.txt}" font-weight="${f.txtWB}" font-size="${F}" class="ch">`;
    s += `<tspan>${esc(p.root)}</tspan>`;
    s += accT(p.acc, F);
    if (p.qual) {
      const qF = F * 0.74;
      const bits = p.qual.split(/([#b♯♭](?=\d))/);
      for (const b of bits) {
        if (!b) continue;
        if (/^[#b♯♭]$/.test(b)) s += accT(b === "♯" ? "#" : b === "♭" ? "b" : b, qF);
        else s += `<tspan font-size="${qF.toFixed(1)}">${esc(b)}</tspan>`;
      }
    }
    if (p.bass) {
      s += `<tspan font-size="${F}">/${esc(p.bass.root)}</tspan>`;
      s += accT(p.bass.acc, F);
    }
    return s + "</text>";
  }

  function chordText(c, cifrado) {
    const p = chordParts(c, cifrado);
    const a = (x) => (x === "#" ? "♯" : x === "b" ? "♭" : "");
    return p.root + a(p.acc) + p.qual + (p.bass ? "/" + p.bass.root + a(p.bass.acc) : "");
  }

  // ---------- Dibujo ----------
  const PW = 816, PH = 1056, ML = 52, MR = 52, MB = 52;
  const S = 6.8; // espacio de pentagrama en px
  const STEM = 3.5; // largo de plica (espacios) desde el centro

  function render(song, opts = {}) {
    const st = opts.estilo === "C" ? "C" : "J";
    const cif = opts.cifrado === "lat" ? "lat" : "am";
    const f = FAM[st], M = MET[st];
    const parsed = opts.parsed || parse(song);
    const { measures } = parsed;
    const perLine = Math.max(1, Math.min(8, +song.porLinea || 4));
    const fs = 4 * S; // tamaño de fuente musical
    const chordF = st === "J" ? 2.55 * S : 2.5 * S;
    const ks = keyCount(song.tono);
    const accW = (ks >= 0 ? M.sharpW : M.flatW) * S + 0.25 * S;
    const keyW = Math.abs(ks) * accW;
    const clefX = 0.7 * S, keyX = clefX + M.clefW * S + 0.9 * S;
    const tsW = M.tsW * M.tsScale * S + 1.2 * S;
    const W = PW - ML - MR;

    // ---- agrupar en sistemas
    const systems = [];
    let cur = [];
    measures.forEach((m, i) => {
      if (cur.length && (m.breakBefore || cur.length >= perLine)) { systems.push(cur); cur = []; }
      cur.push(m);
    });
    if (cur.length) systems.push(cur);

    // ---- páginas y posiciones verticales
    const pages = [[]];
    const headerH = 168, headerH2 = 70;
    let y = headerH;
    systems.forEach((sys, si) => {
      const hasAbove = sys.some((m) => m.volta || m.dirs.length || m.segno || m.coda);
      const hasBelow = sys.some((m) => m.mark || m.cue);
      const above = (hasAbove ? 7.4 : 4.6) * S;
      const busy = sys.some((m) => m.events || m.stemmed);
      const below = (hasBelow ? (busy ? 8.4 : 6.2) : busy ? 5.2 : 3.6) * S;
      const h = above + 4 * S + below;
      if (y + h > PH - MB && pages[pages.length - 1].length) { pages.push([]); y = headerH2; }
      pages[pages.length - 1].push({ sys, si, top: y + above, h });
      y += h;
    });

    const total = pages.length;
    const allNotes = []; // para ligaduras: {page, sysKey, x, y, tieOut}
    const out = [];
    const hits = [];

    pages.forEach((pg, pi) => {
      let svg = "";
      const pHits = [];
      // encabezado
      if (pi === 0) svg += header(song, parsed, st, cif, f, M);
      else {
        svg += `<text x="${PW / 2}" y="40" text-anchor="middle" font-family="${f.txt}" font-weight="${f.txtWB}" font-size="15">${esc(song.titulo || "Sin título")}</text>`;
        svg += `<text x="${ML}" y="40" font-family="${f.txt}" font-weight="${f.txtWB}" font-size="15">${pi + 1}</text>`;
      }
      if (total > 1) svg += `<text x="${PW / 2}" y="${PH - 24}" text-anchor="middle" font-family="${f.txt}" font-size="11" fill="#555">${pi + 1} / ${total}</text>`;

      pg.forEach(({ sys, si, top }) => {
        const first = si === 0;
        const staffTop = top, mid = top + 2 * S, bot = top + 4 * S;
        const x0 = ML;
        // pentagrama
        for (let l = 0; l < 5; l++) svg += `<line x1="${x0}" x2="${PW - MR}" y1="${(top + l * S).toFixed(2)}" y2="${(top + l * S).toFixed(2)}" stroke="#000" stroke-width="${(0.13 * S).toFixed(2)}"/>`;
        // clave y armadura
        svg += glyph(G.gClef, x0 + clefX, top + 3 * S, f.mus, fs);
        const SH = [0, 1.5, -0.5, 1, 2.5, 0.5, 2], FL = [2, 0.5, 2.5, 1, 3, 1.5, 3.5];
        for (let k = 0; k < Math.abs(ks); k++) {
          const yy = top + (ks > 0 ? SH[k] : FL[k]) * S;
          svg += glyph(ks > 0 ? G.sharp : G.flat, x0 + keyX + k * accW, yy, f.mus, fs);
        }
        let px = x0 + keyX + keyW + 0.8 * S;
        const sysTime = sys[0].time;
        if (first || sys[0].timeChange) {
          svg += timeSig(sysTime, px + 0.2 * S, top, f, M, fs);
          px += tsW;
        }
        // número de compás
        svg += `<text x="${x0}" y="${(bot + 2.6 * S).toFixed(1)}" font-family="${f.txt}" font-size="${(1.55 * S).toFixed(1)}" fill="#000">${sys[0].num}</text>`;
        // anchos
        const isLast = si === systems.length - 1;
        const slots = isLast && sys.length < perLine && !sys.some((m) => m.breakBefore && m !== sys[0]) ? perLine : sys.length;
        const avail = PW - MR - px;
        const mw = avail / Math.max(slots, sys.length);
        // barra inicial del sistema
        svg += `<line x1="${x0}" x2="${x0}" y1="${top}" y2="${bot}" stroke="#000" stroke-width="${(0.16 * S).toFixed(2)}"/>`;

        let mx = px;
        const sysNotes = [];
        sys.forEach((m, mi) => {
          const left = mx, right = mx + mw;
          let cx = left + 1.3 * S;
          if (m.startRepeat) {
            svg += barline(mi === 0 ? left : left, top, "start", S);
            cx += 1.6 * S;
          }
          if (m.timeChange && mi > 0) {
            svg += timeSig(m.time, cx, top, f, M, fs);
            cx += tsW;
          }
          const cw = right - 1.0 * S - cx;
          // volta
          if (m.volta) {
            const prev = mi > 0 ? sys[mi - 1] : null;
            const next = sys[mi + 1];
            const startHere = !prev || prev.volta !== m.volta;
            const endHere = !next || next.volta !== m.volta;
            const vy = top - 6.4 * S;
            const vx1 = left + (startHere ? 0.4 * S : 0), vx2 = right - (endHere ? 0.6 * S : 0);
            svg += `<path d="M${vx1.toFixed(1)} ${(vy + (startHere ? 2.4 * S : 0)).toFixed(1)} L${vx1.toFixed(1)} ${vy.toFixed(1)} L${vx2.toFixed(1)} ${vy.toFixed(1)}${endHere && /:\|/.test(m.rightBar) ? ` L${vx2.toFixed(1)} ${(vy + 2.4 * S).toFixed(1)}` : ""}" fill="none" stroke="#000" stroke-width="${(0.16 * S).toFixed(2)}"/>`;
            if (startHere) svg += `<text x="${(vx1 + 0.6 * S).toFixed(1)}" y="${(vy + 1.9 * S).toFixed(1)}" font-family="${f.txt}" font-weight="${f.txtWB}" font-size="${(1.7 * S).toFixed(1)}">${esc(m.volta)}</text>`;
          }
          // segno / coda / textos
          let ax = left + 0.5 * S;
          if (m.segno) { svg += glyph(G.segno, ax, top - 3.6 * S, f.mus, fs * 0.8); ax += M.segnoW * S * 0.8 + 0.8 * S; }
          if (m.coda) { svg += glyph(G.coda, ax, top - 3.6 * S, f.mus, fs * 0.75); ax += M.codaW * S * 0.75 + 0.8 * S; }
          if (m.dirs.length) {
            const txt = m.dirs.join("  ");
            svg += `<text x="${(right - 0.6 * S).toFixed(1)}" y="${(top - 4.2 * S).toFixed(1)}" text-anchor="end" font-family="${f.txt}" font-weight="${f.txtWB}" font-size="${(1.8 * S).toFixed(1)}" font-style="${st === "C" ? "italic" : "normal"}">${esc(txt)}</text>`;
          }
          // marca de ensayo y pista de letra (debajo)
          let bx = mi === 0 ? Math.max(left + 0.3 * S, x0 + textW(String(m.num), f.txt, 1.55 * S) + 1.2 * S) : left + 0.3 * S;
          const busyBelow = !!(m.events || m.stemmed);
          const markDy = busyBelow ? 2.3 * S : 0;
          if (m.mark) {
            const mF = 2.0 * S;
            const tw = textW(m.mark, f.txt, mF, f.txtWB);
            const by = bot + 1.4 * S + markDy, bh = 2.9 * S;
            svg += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(tw + 1.2 * S).toFixed(1)}" height="${bh.toFixed(1)}" fill="#fff" stroke="#000" stroke-width="${(0.2 * S).toFixed(2)}"/>`;
            svg += `<text x="${(bx + 0.6 * S).toFixed(1)}" y="${(by + bh - 0.75 * S).toFixed(1)}" font-family="${f.txt}" font-weight="${f.txtWB}" font-size="${mF.toFixed(1)}">${esc(m.mark)}</text>`;
            bx += tw + 2.0 * S;
          }
          if (m.cue) {
            svg += `<text x="${bx.toFixed(1)}" y="${(bot + 3.75 * S + markDy).toFixed(1)}" font-family="${f.txt}" font-size="${(1.75 * S).toFixed(1)}" font-style="italic" fill="#222">${esc(m.cue)}</text>`;
          }
          const chordY = top - 1.3 * S;

          // contenido
          if (m.rest) {
            svg += glyph(G.restWhole, left + mw / 2 - (M.restWholeW * S) / 2, top + S, f.mus, fs);
            m.slots = [];
          } else if (m.repeat) {
            svg += glyph(G.rep1, left + mw / 2 - (M.rep1W * S) / 2, mid, f.mus, fs);
          } else if (m.events) {
            const E = m.time.eighths;
            const step = cw / E;
            const placed = [];
            for (const ev of m.events) {
              const x = cx + ev.start * step;
              if (ev.kind === "rest") {
                if (ev.whole) { svg += glyph(G.restWhole, left + mw / 2 - (M.restWholeW * S) / 2, top + S, f.mus, fs); continue; }
                const g = ev.dur >= 8 ? G.restWhole : ev.dur >= 4 ? G.restHalf : ev.dur >= 2 ? G.restQuarter : G.rest8;
                svg += glyph(g, x + 0.2 * S, ev.dur >= 8 ? top + S : mid, f.mus, fs);
                if (ev.dur === 3 || ev.dur === 6) svg += glyph(G.dot, x + 1.6 * S, mid - 0.5 * S, f.mus, fs);
                continue;
              }
              const long = ev.dur >= 4;
              const n = { x, ev, headW: long ? 2.16 * S : M.slashW * S };
              placed.push(n);
              // blanca y redonda: rombo (como en las guías del coro); negra y corchea: slash
              if (long) svg += glyph(ev.dur >= 8 ? G.diamondWhole : G.diamondHalf, x, mid, f.mus, fs * 2);
              else svg += glyph(G.slash, x, mid, f.mus, fs);
              if (ev.dur < 8) {
                n.stemX = x + (long ? 0.1 : 0.07) * S; n.stemEnd = mid + STEM * S;
                svg += stemDown(n.stemX, mid + (long ? 0.1 : 0.9) * S, n.stemEnd, S);
              }
              if (ev.dur === 3 || ev.dur === 6) svg += glyph(G.dot, x + n.headW + 0.45 * S, mid - 0.5 * S, f.mus, fs);
              if (ev.accent) svg += glyph(G.accentBelow, x + 0.07 * S - (M.accentW * S) / 2, mid + (STEM + 0.8) * S, f.mus, fs);
              if (ev.chord) {
                svg += chordSVG(ev.chord, x, chordY, st, cif, chordF);
                if (ev.chord.fermata) svg += glyph(G.fermata, x + n.headW / 2 - (M.fermataW * S) / 2, top - 4.1 * S, f.mus, fs);
              }
              sysNotes.push({ x, w: n.headW, tieOut: ev.tieOut, m });
            }
            // corcheas: barras o banderas
            const grp = m.time.group;
            let i = 0;
            while (i < placed.length) {
              const a = placed[i];
              if (a.ev.dur !== 1) { i++; continue; }
              const g = Math.floor(a.ev.start / grp);
              let j = i;
              while (j + 1 < placed.length && placed[j + 1].ev.dur === 1 && Math.floor(placed[j + 1].ev.start / grp) === g && placed[j + 1].ev.start === placed[j].ev.start + 1) j++;
              if (j > i) {
                const xa = placed[i].stemX - 0.07 * S, xb = placed[j].stemX + 0.07 * S, yb = placed[i].stemEnd;
                svg += `<rect x="${xa.toFixed(1)}" y="${(yb - 0.5 * S).toFixed(1)}" width="${(xb - xa).toFixed(1)}" height="${(0.5 * S).toFixed(1)}" fill="#000"/>`;
              } else {
                svg += glyph(G.flag8Down, a.stemX - 0.07 * S, a.stemEnd, f.mus, fs);
              }
              i = j + 1;
            }
          } else {
            const b = m.slots.length;
            const step = cw / b;
            for (let k = 0; k < b; k++) {
              const c = m.slots[k];
              const x = cx + k * step;
              const restEmpty = m.slots.slice(k + 1).every((z) => !z);
              if (c && c.hold && restEmpty && (k === 0 || (b - k) * 2 >= b)) {
                // acorde sostenido: rombo grande (redonda) o rombo blanco con plica (blanca)
                const whole = k === 0;
                svg += glyph(whole ? G.diamondWhole : G.diamondHalf, x, mid, f.mus, fs * 2);
                const hw = 2.16 * S;
                if (!whole) svg += stemDown(x + 0.1 * S, mid + 0.1 * S, mid + STEM * S, S);
                svg += chordSVG(c, x, chordY, st, cif, chordF);
                if (c.fermata) svg += glyph(G.fermata, x + hw / 2 - (M.fermataW * S) / 2, top - 4.1 * S, f.mus, fs);
                sysNotes.push({ x, w: hw, tieOut: m.tieOutSlot, m });
                break;
              }
              svg += glyph(G.slash, x, mid, f.mus, fs);
              if (m.stemmed) svg += stemDown(x + 0.07 * S, mid + 0.9 * S, mid + STEM * S, S);
              if (c) {
                svg += chordSVG(c, x, chordY, st, cif, chordF);
                if (c.fermata) svg += glyph(G.fermata, x + (M.slashW * S) / 2 - (M.fermataW * S) / 2, top - 4.1 * S, f.mus, fs);
              }
              if (k === b - 1) sysNotes.push({ x, w: M.slashW * S, tieOut: m.tieOutSlot, m });
            }
          }
          if (m.fermataBar) svg += glyph(G.fermata, left + mw / 2 - (M.fermataW * S) / 2, top - 4.1 * S, f.mus, fs);

          // barra final del compás
          const rb = m.rightBar || "|";
          const lastInSys = mi === sys.length - 1;
          let kind = "single";
          if (rb === "||") kind = "double";
          else if (rb === "|]") kind = "final";
          else if (rb === ":|") kind = "end";
          else if (rb === ":|:") kind = "end"; // el inicio se dibuja en el compás siguiente
          else if (rb === "|:") kind = "single";
          svg += barline(right, top, kind, S);

          pHits.push({ num: m.num, start: m.start, end: m.end, x: left, y: top - 6.5 * S, w: mw, h: 12.5 * S });
          mx = right;
        });
        // ligaduras dentro del sistema y hacia el siguiente
        for (let k = 0; k < sysNotes.length; k++) {
          const n = sysNotes[k];
          if (!n.tieOut) continue;
          const nx = sysNotes[k + 1];
          const x1 = n.x + n.w * 0.75, ty = mid - 1.3 * S;
          const x2 = nx ? nx.x + nx.w * 0.3 : PW - MR + 0.5 * S;
          svg += tie(x1, x2, ty, S);
        }
        if (allNotes.pendingTie && sysNotes.length) {
          const nx = sysNotes[0];
          svg += tie(px - 0.5 * S, nx.x + nx.w * 0.3, mid - 1.3 * S, S);
        }
        allNotes.pendingTie = sysNotes.length && sysNotes[sysNotes.length - 1].tieOut;
      });
      out.push(svg);
      hits.push(pHits);
    });

    return { pages: out, hits, parsed, width: PW, height: PH, estilo: st };
  }

  function glyph(ch, x, y, fam, size) {
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${fam}" font-size="${size.toFixed(1)}">${ch}</text>`;
  }
  function tie(x1, x2, y, S) {
    // ligadura hacia arriba (las plicas van hacia abajo)
    const h = Math.min(1.7 * S, 0.8 * S + (x2 - x1) * 0.035);
    const mx = (x1 + x2) / 2;
    return `<path d="M${x1.toFixed(1)} ${y.toFixed(1)} Q${mx.toFixed(1)} ${(y - h * 1.3).toFixed(1)} ${x2.toFixed(1)} ${y.toFixed(1)} Q${mx.toFixed(1)} ${(y - h * 1.3 + 0.5 * S).toFixed(1)} ${x1.toFixed(1)} ${y.toFixed(1)}Z" fill="#000"/>`;
  }
  function stemDown(x, y1, y2, S) {
    return `<rect x="${(x - 0.07 * S).toFixed(2)}" y="${y1.toFixed(1)}" width="${(0.14 * S).toFixed(2)}" height="${(y2 - y1).toFixed(1)}" fill="#000"/>`;
  }
  function barline(x, top, kind, S) {
    const bot = top + 4 * S, thin = 0.16 * S, thick = 0.55 * S;
    const L = (xx, w) => `<rect x="${(xx - w / 2).toFixed(2)}" y="${top.toFixed(1)}" width="${w.toFixed(2)}" height="${(4 * S).toFixed(1)}" fill="#000"/>`;
    const dots = (xx) => `<circle cx="${xx.toFixed(1)}" cy="${(top + 1.5 * S).toFixed(1)}" r="${(0.24 * S).toFixed(2)}"/><circle cx="${xx.toFixed(1)}" cy="${(top + 2.5 * S).toFixed(1)}" r="${(0.24 * S).toFixed(2)}"/>`;
    if (kind === "single") return L(x, thin);
    if (kind === "double") return L(x - 0.5 * S, thin) + L(x, thin);
    if (kind === "final") return L(x - 0.75 * S, thin) + L(x - thick / 2, thick);
    if (kind === "end") return dots(x - 1.45 * S) + L(x - 0.75 * S, thin) + L(x - thick / 2, thick);
    if (kind === "start") return L(x + thick / 2, thick) + L(x + 0.75 * S, thin) + dots(x + 1.45 * S);
    return "";
  }
  function timeSig(t, x, top, f, M, fs) {
    const sc = fs * M.tsScale;
    const num = String(t.num), den = String(t.den);
    const g = (str, y) => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${f.mus}" font-size="${sc.toFixed(1)}">${[...str].map(tsDigit).join("")}</text>`;
    return g(num, top + S) + g(den, top + 3 * S);
  }

  function header(song, parsed, st, cif, f, M) {
    let s = "";
    const T = f.txt, B = f.txtWB;
    const title = song.titulo || "Sin título";
    let tF = 34;
    while (tF > 18 && textW(title, T, tF, B) > PW - 2 * ML - 260) tF -= 1;
    if (song.instrumento) s += `<text x="${ML}" y="58" font-family="${T}" font-weight="${B}" font-size="20">${esc(song.instrumento)}</text>`;
    s += `<text x="${PW / 2}" y="62" text-anchor="middle" font-family="${T}" font-weight="${B}" font-size="${tF}">${esc(title)}</text>`;
    if (song.subtitulo) s += `<text x="${PW / 2}" y="84" text-anchor="middle" font-family="${T}" font-weight="${B}" font-size="14">${esc(song.subtitulo)}</text>`;
    if (song.autor) s += `<text x="${PW - MR}" y="84" text-anchor="end" font-family="${T}" font-weight="${B}" font-size="13">${esc(song.autor)}</text>`;
    // fila de datos
    const parts = [];
    if (song.tono) {
      const c = parseChord(String(song.tono).trim().split(/\s+/)[0]);
      parts.push("Tono: " + (c ? chordText(c, cif) : song.tono) + (/menor/i.test(song.tono) ? " menor" : ""));
    }
    parts.push("Compás " + parsed.time.label);
    if (song.estilo) parts.push(song.estilo);
    let x = ML;
    const y = 116;
    if (song.bpm) {
      s += glyph(G.metQ, x, y, f.mus, 4 * S * 0.9);
      x += 1.5 * S + 4;
      const bt = `= ${song.bpm}`;
      s += `<text x="${x}" y="${y}" font-family="${T}" font-weight="${B}" font-size="14">${esc(bt)}</text>`;
      x += textW(bt, T, 14, B) + 22;
    }
    const info = parts.join("   ·   ");
    s += `<text x="${x}" y="${y}" font-family="${T}" font-size="14" font-weight="${f.txtW}">${esc(info)}</text>`;
    // mapa
    const mapa = (song.mapa && song.mapa.trim()) || autoMap(parsed.sections);
    if (mapa) {
      const label = "Mapa:  ";
      const lw = textW(label, T, 13, B);
      s += `<text x="${ML}" y="140" font-family="${T}" font-weight="${B}" font-size="13">${label}</text>`;
      const lines = wrap(mapa, T, 13, f.txtW, PW - ML - MR - lw);
      lines.slice(0, 2).forEach((ln, i) => {
        s += `<text x="${ML + lw}" y="${140 + i * 16}" font-family="${T}" font-weight="${f.txtW}" font-size="13">${esc(ln)}</text>`;
      });
    }
    return s;
  }
  function autoMap(secs) {
    const out = [];
    for (const s of secs) if (out[out.length - 1] !== s) out.push(s);
    return out.join(" – ");
  }
  function wrap(text, fam, size, w, maxW) {
    const words = text.split(/\s+/);
    const lines = [];
    let cur = "";
    for (const wd of words) {
      const t = cur ? cur + " " + wd : wd;
      if (textW(t, fam, size, w) > maxW && cur) { lines.push(cur); cur = wd; } else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function pageSVG(inner, { embedFonts = false, extra = "" } = {}) {
    const style = embedFonts ? `<style>${fontFaceCSS()}</style>` : "";
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PW} ${PH}" width="${PW}" height="${PH}">${style}<rect width="${PW}" height="${PH}" fill="#fff"/>${inner}${extra}</svg>`;
  }

  return { parse, render, pageSVG, fontFaceCSS, parseChord, chordText, autoMap, keyCount, parseTime, PW, PH };
})();

</script>
<script>
(() => {
  // ================= Estado =================
  const $ = (s, r = document) => r.querySelector(s);
  const app = $("#app");
  const LS = {
    get(k, d) { try { const v = localStorage.getItem("gr:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("gr:" + k, JSON.stringify(v)); } catch {} },
  };
  const state = {
    songs: {}, setlists: {}, loaded: false, slow: false,
    canEdit: false, db: null, downloads: null, local: false,
    prefs: { cif: LS.get("cif", "am"), est: LS.get("est", "J") },
    view: "lib", id: null, filter: "", activeSet: null, draft: null, saveTimer: null, saveState: "",
  };
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function toast(msg, ms = 3200) {
    const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), ms);
  }

  // ================= Datos =================
  const local = {
    load() { state.songs = LS.get("songs", {}); state.setlists = LS.get("setlists", {}); },
    save() { LS.set("songs", state.songs); LS.set("setlists", state.setlists); },
  };
  async function putSong(id, data) {
    state.songs[id] = data;
    if (state.db) await state.db.doc("songs/" + id).set(data);
    else local.save();
  }
  async function delSong(id) {
    delete state.songs[id];
    if (state.db) await state.db.doc("songs/" + id).delete(); else local.save();
  }
  async function putSet(id, data) {
    state.setlists[id] = data;
    if (state.db) await state.db.doc("setlists/" + id).set(data); else local.save();
  }
  async function delSet(id) {
    delete state.setlists[id];
    if (state.db) await state.db.doc("setlists/" + id).delete(); else local.save();
  }

  async function init() {
    await document.fonts.ready;
    try { await Promise.all(["GRTxtJ", "GRTxtC", "GRMusJ", "GRMusC"].map((f) => document.fonts.load(`16px '${f}'`, "A"))); await document.fonts.load(`700 16px 'GRTxtC'`); } catch {}
    paintPrefs();
    window.addEventListener("hashchange", route);
    route();
    const hasClaude = !!(window.claude && window.claude.use);
    if (!hasClaude) { startLocal(); return; }
    const [db, user, dl] = await Promise.all([
      window.claude.use("db").catch(() => null),
      window.claude.use("user").catch(() => null),
      window.claude.use("downloads").catch(() => null),
    ]);
    state.downloads = dl;
    if (!db) { startLocal(); return; }
    state.db = db;
    state.canEdit = user ? !!(await user.isOwner()) : false;
    let got = { songs: false, sets: false };
    const timer = setTimeout(() => { if (!state.loaded) { state.slow = true; render(); } }, 10000);
    const done = () => { if (got.songs && got.sets) { state.loaded = true; state.slow = false; clearTimeout(timer); } };
    db.collection("songs").onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach((d) => (next[d.id] = d.data()));
      // conservar el borrador local si se está editando
      if (state.view === "edit" && state.draft && next[state.id] && state.saveState === "pending") next[state.id] = state.songs[state.id];
      state.songs = next;
      if (!snap.metadata.fromCache) got.songs = true;
      done();
      if (state.view !== "edit") render();
    }, () => { got.songs = true; done(); render(); });
    db.collection("setlists").onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach((d) => (next[d.id] = d.data()));
      state.setlists = next;
      if (!snap.metadata.fromCache) got.sets = true;
      done();
      if (state.view !== "edit") render();
    }, () => { got.sets = true; done(); render(); });
  }
  function startLocal() {
    state.local = true; state.canEdit = true; state.loaded = true;
    local.load(); render();
  }

  // ================= Preferencias =================
  function paintPrefs() {
    document.querySelectorAll("[data-cif]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cif === state.prefs.cif)));
    document.querySelectorAll("[data-est]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.est === state.prefs.est)));
  }
  document.addEventListener("click", (e) => {
    const c = e.target.closest("[data-cif]"), s = e.target.closest("[data-est]");
    if (c) { state.prefs.cif = c.dataset.cif; LS.set("cif", state.prefs.cif); paintPrefs(); rerenderSheets(); }
    if (s) { state.prefs.est = s.dataset.est; LS.set("est", state.prefs.est); paintPrefs(); rerenderSheets(); }
  });
  function rerenderSheets() { if (state.view === "edit") updatePreview(); else render(); }

  // ================= Rutas =================
  function route() {
    const h = location.hash.replace(/^#/, "");
    let m;
    if ((m = h.match(/^cancion-([a-z0-9]+)$/))) { state.view = "song"; state.id = m[1]; }
    else if ((m = h.match(/^editar-([a-z0-9]+)$/))) { state.view = "edit"; state.id = m[1]; state.draft = null; }
    else if ((m = h.match(/^setlist-([a-z0-9]+)$/))) { state.view = "setview"; state.id = m[1]; }
    else if (h === "setlists") { state.view = "sets"; }
    else { state.view = "lib"; }
    $("#tab-lib").setAttribute("aria-current", ["lib", "song", "edit"].includes(state.view) ? "page" : "false");
    $("#tab-sets").setAttribute("aria-current", ["sets", "setview"].includes(state.view) ? "page" : "false");
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    if (state.view === "edit") return renderEditor();
    if (state.view === "song") return renderSong();
    if (state.view === "sets") return renderSets();
    if (state.view === "setview") return renderSetView();
    return renderLib();
  }

  function banners() {
    let s = "";
    if (state.local) s += `<div class="banner">Modo local: las guías se guardan solo en este navegador. Abre la app en claude.ai para guardarlas en la nube y compartirlas con el equipo.</div>`;
    if (state.slow && !state.loaded) s += `<div class="banner">No se pudo cargar la biblioteca todavía. Revisa tu conexión; la página seguirá intentando.</div>`;
    return s;
  }
  const sortedSongs = () => Object.entries(state.songs).sort((a, b) => (a[1].titulo || "").localeCompare(b[1].titulo || "", "es"));
  const fmtTono = (t) => {
    if (!t) return "";
    const c = GR.parseChord(String(t).trim().split(/\s+/)[0]);
    return c ? GR.chordText(c, state.prefs.cif) : t;
  };

  // ================= Biblioteca =================
  function renderLib() {
    const q = state.filter.toLowerCase();
    const list = sortedSongs().filter(([, s]) => !q || (s.titulo + " " + (s.subtitulo || "")).toLowerCase().includes(q));
    let h = banners();
    h += `<div class="lib-head"><h1>Biblioteca</h1>
      <label class="sr" for="buscar">Buscar alabanza</label>
      <input id="buscar" type="search" placeholder="Buscar alabanza…" value="${esc(state.filter)}">
      ${state.canEdit ? `<button class="btn primary" id="nueva" type="button">+ Nueva guía</button>` : ""}</div>`;
    if (!state.loaded) h += `<p class="muted">Cargando biblioteca…</p>`;
    else if (!Object.keys(state.songs).length) {
      h += `<div class="empty"><h2>Aún no hay guías</h2><p class="muted">${state.canEdit ? "Crea la primera alabanza. La guía se arma escribiendo compases y se ve al instante como partitura." : "Cuando el líder publique guías aparecerán aquí."}</p>
      ${state.canEdit ? `<button class="btn primary" type="button" data-act="nueva">+ Crear primera guía</button>` : ""}</div>`;
    } else if (!list.length) h += `<p class="muted">Ninguna alabanza coincide con «${esc(state.filter)}».</p>`;
    else {
      h += `<div class="songs">` + list.map(([id, s]) => `
        <article class="song">
          <div class="t">${esc(s.titulo || "Sin título")}</div>
          ${s.subtitulo ? `<div class="muted">${esc(s.subtitulo)}</div>` : ""}
          <div class="meta">${s.tono ? `<span class="chip key">${esc(fmtTono(s.tono))}</span>` : ""}${s.bpm ? `<span class="chip">♩ ${esc(s.bpm)}</span>` : ""}<span class="chip">${esc(s.compas || "4/4")}</span>${s.estilo ? `<span class="chip">${esc(s.estilo)}</span>` : ""}</div>
          <div class="acts">
            <a class="btn small" href="#cancion-${id}">Ver guía</a>
            <button class="btn small" type="button" data-pdf="${id}">PDF</button>
            ${state.canEdit ? `<a class="btn small" href="#editar-${id}">Editar</a><button class="btn small" type="button" data-dup="${id}">Duplicar</button><button class="btn small danger" type="button" data-del="${id}">Eliminar</button>` : ""}
          </div>
          <div class="confirm hidden row" data-confirm="${id}"><span>¿Eliminar «${esc(s.titulo || "Sin título")}»?</span><button class="btn small danger" type="button" data-delok="${id}">Sí, eliminar</button><button class="btn small" type="button" data-delno="${id}">Cancelar</button></div>
        </article>`).join("") + `</div>`;
    }
    app.innerHTML = h;
    const b = $("#buscar");
    if (b) b.addEventListener("input", () => { state.filter = b.value; const pos = b.selectionStart; renderLib(); const nb = $("#buscar"); nb.focus(); nb.setSelectionRange(pos, pos); });
  }

  const NEW_SONG = () => ({
    titulo: "Nueva alabanza", subtitulo: "", instrumento: "Guitarra-Piano", autor: "", tono: "C", compas: "4/4", bpm: "72", estilo: "", mapa: "", porLinea: 4,
    cuerpo: `- || C | G |\n[A] "Primera frase…" C | G/B | Am | F |\nC | G | F G {o--o----} | C* :|\n`,
  });

  app.addEventListener("click", async (e) => {
    const t = e.target.closest("button, a"); if (!t) return;
    const d = t.dataset;
    if (t.id === "nueva" || d.act === "nueva") {
      const id = uid(); const s = { ...NEW_SONG(), actualizado: Date.now() };
      try { await putSong(id, s); location.hash = "editar-" + id; } catch (err) { toast("No se pudo crear la guía: " + (err.message || err.code)); }
    }
    if (d.dup) {
      const id = uid(); const s = { ...state.songs[d.dup], titulo: (state.songs[d.dup].titulo || "") + " (copia)", actualizado: Date.now() };
      try { await putSong(id, s); toast("Guía duplicada."); render(); } catch (err) { toast("No se pudo duplicar: " + (err.message || err.code)); }
    }
    if (d.del) $(`[data-confirm="${d.del}"]`).classList.remove("hidden");
    if (d.delno) $(`[data-confirm="${d.delno}"]`).classList.add("hidden");
    if (d.delok) { try { await delSong(d.delok); toast("Guía eliminada."); render(); } catch (err) { toast("No se pudo eliminar: " + (err.message || err.code)); } }
    if (d.pdf) exportPDF([d.pdf], (state.songs[d.pdf].titulo || "Guía") + " - Guía.pdf");
  });

  // ================= Lector =================
  function sheetsHTML(song, { hits = false } = {}) {
    const r = GR.render(song, { estilo: state.prefs.est, cifrado: state.prefs.cif });
    return { r, html: r.pages.map((p, i) => {
      const extra = hits ? r.hits[i].map((h) => `<rect class="mhit" data-s="${h.start}" data-e="${h.end}" data-n="${h.num}" x="${h.x.toFixed(1)}" y="${h.y.toFixed(1)}" width="${h.w.toFixed(1)}" height="${h.h.toFixed(1)}"><title>Compás ${h.num}</title></rect>`).join("") : "";
      return `<div class="sheet" role="img" aria-label="${esc(song.titulo || "Guía")} página ${i + 1}">${GR.pageSVG(p, { extra })}</div>`;
    }).join("") };
  }

  function renderSong() {
    const s = state.songs[state.id];
    if (!s) { app.innerHTML = banners() + (state.loaded ? `<p>Esta guía no existe o fue eliminada. <a href="#biblioteca">Volver a la biblioteca</a></p>` : `<p class="muted">Cargando…</p>`); return; }

    app.innerHTML = banners() + `<div class="reader-head"><a class="btn" href="#biblioteca">← Biblioteca</a>

      <div class="sheet-wrap">${html}</div>`;
  }

    const s = state.songs[id];

  function insertAt(ta, text, backFromEnd = 0) {
    const a = ta.selectionStart, b = ta.selectionEnd;
    ta.setRangeText(text, a, b, "end");
    if (backFromEnd) { const p = a + text.length - backFromEnd - (text.endsWith(" ") ? 1 : 0); ta.setSelectionRange(p, p); }
    ta.focus();
    ta.dispatchEvent(new Event("input"));
  }

  let prevTimer;
  function changed() {
    state.saveState = "pending";
    const st = $("#status"); if (st) { st.textContent = "Cambios sin guardar…"; st.className = "status"; }
    clearTimeout(prevTimer); prevTimer = setTimeout(updatePreview, 120);
    clearTimeout(state.saveTimer); state.saveTimer = setTimeout(flushSave, 1500);
  }
  async function flushSave() {
    clearTimeout(state.saveTimer);
    if (state.saveState !== "pending" || !state.draft) return;
    const id = state.id, data = { ...state.draft, actualizado: Date.now() };
    state.saveState = "saving";
    try {
      await putSong(id, data);
      if (state.saveState === "saving") state.saveState = "saved";
      const st = $("#status"); if (st && state.saveState === "saved") { st.textContent = "Guardado"; st.className = "status ok"; }
    } catch (err) {
      state.saveState = "pending";
      const st = $("#status"); if (st) { st.textContent = "No se pudo guardar. " + (err.code === "quota_exceeded" ? "La biblioteca está llena." : "Reintentando…"); }
      state.saveTimer = setTimeout(flushSave, 4000);
    }
  }
  window.addEventListener("hashchange", () => { if (state.saveState === "pending") flushSave(); });

  function updatePreview() {
    const pv = $("#preview"); if (!pv || !state.draft) return;
    const { r, html } = sheetsHTML(state.draft, { hits: true });
    pv.innerHTML = html;
    const w = $("#warns");
    w.innerHTML = r.parsed.warnings.slice(0, 8).map((x) => `<div>Compás ${x.num}: ${esc(x.msg)}</div>`).join("");
    highlightCaret();
  }
  function highlightCaret() {
    const ta = $("#cuerpo"); if (!ta) return;
    const p = ta.selectionStart;
    let best = null;
    app.querySelectorAll(".mhit").forEach((r) => {
      r.classList.remove("on");
      const s = +r.dataset.s, e = +r.dataset.e;
      if (p >= s && p <= e + 1) best = r;
    });
    if (best) best.classList.add("on");
  }

  // ---------- Constructor de cortes ----------
  function openRhythm() {
    const box = $("#rb");
    const t = GR.parseTime(state.draft.compas);
    const E = t.eighths;
    const labels = [];
    for (let i = 0; i < E; i++) labels.push(t.compound ? (i % 3 === 0 ? String(i / 3 + 1) : "·") : (i % 2 === 0 ? String(i / 2 + 1) : "y"));
    const cells = Array(E).fill(".");
    cells[0] = "x";
    const SYM = { x: "›", o: "●", "-": "—", ".": "" };
    const draw = () => {
      box.innerHTML = `<div class="row" style="justify-content:space-between"><strong>Corte en corcheas (${t.label})</strong><button class="btn small" type="button" id="rb-close">Cerrar</button></div>
        <div class="legend">Toca cada casilla para cambiar: <b>›</b> golpe acentuado · <b>●</b> golpe · <b>—</b> sostener · vacío = silencio.</div>
        <div class="rb-grid" style="grid-template-columns:repeat(${E},1fr)">${cells.map((c, i) => `<div class="rb-cell"><button type="button" data-cell="${i}" data-s="${c}" aria-label="Corchea ${i + 1}: ${c === "x" ? "golpe acentuado" : c === "o" ? "golpe" : c === "-" ? "sostener" : "silencio"}">${SYM[c]}</button><span>${labels[i]}</span></div>`).join("")}</div>
        <label for="rb-ch">Acordes de los golpes, en orden</label><input id="rb-ch" type="text" placeholder="Em F#m G A" value="${esc(box.dataset.ch || "")}">
        <div class="row"><code id="rb-out" style="font-family:var(--mono)"></code><button class="btn small primary" type="button" id="rb-ins">Insertar compás</button></div>`;
      const out = () => { const ch = $("#rb-ch").value.trim(); return `${ch ? ch + " " : ""}{${cells.join("")}} | `; };
      $("#rb-out").textContent = out();
      $("#rb-ch").addEventListener("input", (e) => { box.dataset.ch = e.target.value; $("#rb-out").textContent = out(); });
      box.querySelectorAll("[data-cell]").forEach((b) => b.addEventListener("click", () => {
        const i = +b.dataset.cell; const order = ["x", "o", "-", "."];
        let n = order[(order.indexOf(cells[i]) + 1) % 4];
        if (n === "-" && i === 0) n = "-"; // permitido: liga con el compás anterior
        cells[i] = n; draw(); box.querySelector(`[data-cell="${i}"]`).focus();
      }));
      $("#rb-close").addEventListener("click", () => box.classList.add("hidden"));
      $("#rb-ins").addEventListener("click", () => { insertAt($("#cuerpo"), out()); box.classList.add("hidden"); });
    };
    box.classList.remove("hidden");
    draw();
  }

  // ================= Setlists =================
  function renderSets() {
    const sets = Object.entries(state.setlists).sort((a, b) => (b[1].fecha || "").localeCompare(a[1].fecha || ""));
    if (!state.activeSet || !state.setlists[state.activeSet]) state.activeSet = sets[0]?.[0] || null;
    const cur = state.activeSet ? state.setlists[state.activeSet] : null;
    let h = banners() + `<div class="lib-head"><h1>Setlists</h1>${state.canEdit ? `<button class="btn primary" type="button" id="new-set">+ Nuevo setlist</button>` : ""}</div>`;
    if (!state.loaded) { app.innerHTML = h + `<p class="muted">Cargando…</p>`; return; }
    if (!sets.length) {
      app.innerHTML = h + `<div class="empty"><h2>Sin setlists</h2><p class="muted">${state.canEdit ? "Arma la lista del domingo con las guías de la biblioteca." : "Aún no hay setlists publicados."}</p></div>`;
      bindSets(); return;
    }
    h += `<div class="sets"><nav class="setlist-list" aria-label="Setlists">${sets.map(([id, s]) => `<button type="button" data-set="${id}" aria-current="${id === state.activeSet}"><strong>${esc(s.nombre || "Sin nombre")}</strong><small>${esc(fmtFecha(s.fecha))} · ${(s.canciones || []).length} alabanzas</small></button>`).join("")}</nav>`;
    const songs = (cur.canciones || []).filter((id) => state.songs[id]);
    h += `<section class="panel">`;
    if (state.canEdit) {
      h += `<div class="fields"><label for="s-nombre">Nombre<input id="s-nombre" type="text" value="${esc(cur.nombre || "")}"></label><label for="s-fecha">Fecha<input id="s-fecha" type="date" value="${esc(cur.fecha || "")}"></label></div>`;
    } else h += `<h2>${esc(cur.nombre || "Sin nombre")}</h2><div class="muted">${esc(fmtFecha(cur.fecha))}</div>`;
    h += songs.length ? `<ol class="order">${songs.map((id, i) => { const s = state.songs[id]; return `<li><div><div class="t">${esc(s.titulo)}</div><div class="muted" style="font-size:13px">${esc([fmtTono(s.tono), s.bpm ? "♩ " + s.bpm : "", s.compas].filter(Boolean).join(" · "))}</div></div>
      <div class="row">${state.canEdit ? `<button class="btn small" type="button" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Subir">↑</button><button class="btn small" type="button" data-down="${i}" ${i === songs.length - 1 ? "disabled" : ""} aria-label="Bajar">↓</button><button class="btn small danger" type="button" data-rm="${i}" aria-label="Quitar">Quitar</button>` : `<a class="btn small" href="#cancion-${id}">Ver</a>`}</div></li>`; }).join("")}</ol>` : `<p class="muted">Este setlist todavía no tiene alabanzas.</p>`;
    if (state.canEdit) {
      const avail = sortedSongs().filter(([id]) => !songs.includes(id));
      h += `<div class="row"><label class="sr" for="s-add">Agregar alabanza</label><select id="s-add"><option value="">Agregar alabanza…</option>${avail.map(([id, s]) => `<option value="${id}">${esc(s.titulo)}</option>`).join("")}</select></div>`;
    }
    h += `<div class="row"><a class="btn" href="#setlist-${state.activeSet}">Ver todas las guías</a><button class="btn primary" type="button" id="set-pdf" ${songs.length ? "" : "disabled"}>PDF del setlist</button>
      ${state.canEdit ? `<button class="btn danger" type="button" id="set-del">Eliminar setlist</button><span class="hidden row" id="set-del-c">¿Seguro? <button class="btn small danger" type="button" id="set-del-ok">Sí, eliminar</button></span>` : ""}</div></section></div>`;
    app.innerHTML = h;
    bindSets();
  }
  function fmtFecha(f) {
    if (!f) return "Sin fecha";
    const d = new Date(f + "T12:00:00");
    return isNaN(d) ? f : d.toLocaleDateString("es", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }
  function bindSets() {
    const id = state.activeSet, cur = id && state.setlists[id];
    const save = (patch) => putSet(id, { ...state.setlists[id], ...patch }).catch((err) => toast("No se pudo guardar: " + (err.message || err.code)));
    $("#new-set")?.addEventListener("click", async () => {
      const nid = uid(); const sunday = new Date(); sunday.setDate(sunday.getDate() + ((7 - sunday.getDay()) % 7));
      await putSet(nid, { nombre: "Culto del domingo", fecha: sunday.toISOString().slice(0, 10), canciones: [] }).catch((err) => toast("No se pudo crear: " + (err.message || err.code)));
      state.activeSet = nid; renderSets();
    });
    app.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => { state.activeSet = b.dataset.set; renderSets(); }));
    if (!cur) return;
    const list = (cur.canciones || []).filter((x) => state.songs[x]);
    let nt;
    $("#s-nombre")?.addEventListener("input", (e) => { clearTimeout(nt); const v = e.target.value; state.setlists[id].nombre = v; nt = setTimeout(() => save({ nombre: v }), 900); });
    $("#s-fecha")?.addEventListener("change", (e) => { save({ fecha: e.target.value }); state.setlists[id].fecha = e.target.value; renderSets(); });
    $("#s-add")?.addEventListener("change", async (e) => { if (!e.target.value) return; await save({ canciones: [...list, e.target.value] }); renderSets(); });
    app.querySelectorAll("[data-up],[data-down],[data-rm]").forEach((b) => b.addEventListener("click", async () => {
      const l = [...list];
      if (b.dataset.up) { const i = +b.dataset.up; [l[i - 1], l[i]] = [l[i], l[i - 1]]; }
      if (b.dataset.down) { const i = +b.dataset.down; [l[i + 1], l[i]] = [l[i], l[i + 1]]; }
      if (b.dataset.rm) l.splice(+b.dataset.rm, 1);
      await save({ canciones: l }); renderSets();
    }));
    $("#set-pdf")?.addEventListener("click", () => exportPDF(list, (cur.nombre || "Setlist") + " " + (cur.fecha || "") + ".pdf"));
    $("#set-del")?.addEventListener("click", () => $("#set-del-c").classList.remove("hidden"));
    $("#set-del-ok")?.addEventListener("click", async () => { await delSet(id).catch(() => {}); state.activeSet = null; renderSets(); });
  }

  function renderSetView() {
    const cur = state.setlists[state.id];
    if (!cur) { app.innerHTML = banners() + (state.loaded ? `<p>Este setlist no existe. <a href="#setlists">Volver</a></p>` : `<p class="muted">Cargando…</p>`); return; }

    app.innerHTML = banners() + `<div class="reader-head"><div><a class="btn" href="#setlists">← Setlists</a></div>
      <div><h1>${esc(cur.nombre || "Setlist")}</h1><div class="muted">${esc(fmtFecha(cur.fecha))} · ${list.map((id, i) => `${i + 1}. ${esc(state.songs[id].titulo)}`).join("  ")}</div></div>

      <div class="sheet-wrap">${list.map((id) => sheetsHTML(state.songs[id]).html).join("")}</div>`;

  // ================= PDF =================
  let exporting = false;
  async function exportPDF(ids, filename) {
    if (exporting) return;
    if (!window.jspdf) { toast("No se pudo cargar el generador de PDF. Revisa tu conexión y recarga."); return; }
    exporting = true;
    toast("Preparando PDF…", 60000);
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "pt", format: "letter", compress: true });
      let first = true;
      for (const id of ids) {
        const song = state.view === "edit" && id === state.id && state.draft ? state.draft : state.songs[id];
        if (!song) continue;
        const r = GR.render(song, { estilo: state.prefs.est, cifrado: state.prefs.cif });
        for (const p of r.pages) {
          const png = await rasterize(GR.pageSVG(p, { embedFonts: true }), 3);
          if (!first) pdf.addPage("letter");
          pdf.addImage(png, "PNG", 0, 0, 612, 792, undefined, "FAST");
          first = false;
        }
      }
      const data = pdf.output("arraybuffer");
      if (!state.downloads) {
        if (state.local) {
          const url = URL.createObjectURL(new Blob([data], { type: "application/pdf" }));
          const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
          toast("PDF generado.");
        } else toast("La descarga no está disponible en esta vista. Abre la app en claude.ai para descargar el PDF.");
        return;
      }
      await state.downloads.save({ filename: filename.replace(/[\\/:*?"<>|]/g, "-"), data });
      toast("PDF listo para imprimir.");
    } catch (err) {
      const c = err && err.code;
      if (c === "declined") toast("Descarga cancelada.");
      else if (c === "rate_limited") toast("Ya hay una descarga esperando confirmación.");
      else toast("No se pudo generar el PDF" + (err && err.message ? ": " + err.message : "."));
    } finally { exporting = false; }
  }
  function rasterize(svg, scale) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
      const img = new Image();
      img.onload = async () => {
        try { if (img.decode) await img.decode(); } catch {}
        // pequeña espera para que las fuentes incrustadas terminen de cargar dentro de la imagen
        await new Promise((r) => setTimeout(r, 60));
        const c = document.createElement("canvas");
        c.width = GR.PW * scale; c.height = GR.PH * scale;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/png"));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("no se pudo dibujar la página")); };
      img.src = url;
    });
  }

  // fuentes de la app (mismas que la partitura)
  const st = document.createElement("style"); st.textContent = GR.fontFaceCSS(); document.head.appendChild(st);
  init();
})();
</script>
